<!DOCTYPE html>
<html>
<head>
    <title>Translator</title>

    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 350px;
        }

        textarea {
            width: 100%;
            height: 80px;
            margin-bottom: 15px;
            border-radius: 5px;
            padding: 10px;
            font-size: 16px;
        }

        select {
            margin: 5px;
            padding: 5px;
        }

        button {
            margin: 10px 5px;
            padding: 8px 15px;
            border: none;
            background-color: #38bdf8;
            color: black;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0ea5e9;
        }

        #output {
            margin-top: 15px;
            padding: 10px;
            background-color: #0f172a;
            border-radius: 5px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Language Translator</h2>

<textarea id="text" placeholder="Enter text"></textarea>

<select id="source">
    <option value="en">English</option>
    <option value="ta">Tamil</option>
    <option value="hi">Hindi</option>
    <option value="te">Telugu</option>
    <option value="ml">Malayalam</option>
</select>

<select id="target">
    <option value="ta">Tamil</option>
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="te">Telugu</option>
    <option value="ml">Malayalam</option>
</select>

<br>

<button onclick="translateText()">Translate</button>
<button onclick="copyText()">Copy</button>


<h3 id="output"></h3>

</div>

<script src="script.js"></script>

</body>
</html>
